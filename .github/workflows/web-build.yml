name: web-build

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "web/**"
      - ".github/workflows/web-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build
